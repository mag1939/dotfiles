
# audio and subtitles config
slang=th,thai,en,eng,english
alang=jp,jpn,japanese,en,eng,english

# --- Screenshot Settings ---
# Save screenshots to your user Pictures folder (make sure the folder exists)
screenshot-directory="~/Pictures/screenshots-mpv"

# Use high-quality PNG format (options: png, jpg, webp)
screenshot-format=png

# Filename template: VideoName-YearMonthDay-HourMinuteSecond
screenshot-template="%ty%tm%td-%tH%tM%tS-%n"

# Include subtitles and OSD elements in the screenshot (set to 'no' for video only)
screenshot-sw=yes
