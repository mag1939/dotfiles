"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
final_space = true
version = 4

[palette]
os = "#ACB0BE"
pink = "#F5BDE6"
lavender = "#B7BDF8"
blue = "#8AADF4"
towa_purple = "#7d309e"

[[blocks]]
alignment = "left"
type = "prompt"
newline = true

[[blocks.segments]]
foreground = "p:blue"
style = "plain"
template = "{{ .UserName }}@{{ .HostName }} "
type = "session"

[[blocks.segments]]
foreground = "p:pink"
style = "plain"
template = "{{ .Path }} "
type = "path"

[blocks.segments.options]
home_icon = "~"
style = "agnoster_short"
max_depth = 2

[[blocks.segments]]
foreground = "p:lavender"
template = "{{ .HEAD }} "
style = "plain"
type = "git"

[blocks.segments.options]
branch_icon = " "
cherry_pick_icon = " "
commit_icon = " "
merge_icon = " "
no_commits_icon = " "
rebase_icon = " "
revert_icon = " "
tag_icon = " "

[[blocks]]
alignment = "left"
type = "prompt"
newline = true

  [[blocks.segments]]
    type = "text"
    style = "plain"
    foreground_templates = [
    	"{{if gt .Code 0}}red{{end}}",
    	"{{if eq .Code 0}}p:towa_purple{{end}}"
    ]
    background = "transparent"
    template = ""

[transient_prompt]
background = "transparent"
foreground_templates = [
	"{{if gt .Code 0}}red{{end}}",
	"{{if eq .Code 0}}p:towa_purple{{end}}"
]
template = " "

[secondary_prompt]
foreground = "p:towa_purple"
background = "transparent"
template = " "

[[blocks]]
type = "rprompt"
overflow = "hidden"
  [[blocks.segments]]
  type = "executiontime"
  style = "plain"
  foreground = "yellow"
  background = "transparent"
  template = "{{ .FormattedMs }}"

  [blocks.segments.options]
  threshold = 5000
