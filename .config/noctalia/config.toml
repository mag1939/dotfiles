desktop_placement = "attached"
wide_placement = "attached"

[plugins]
enabled = [
    "liamwh/emoji-picker",
    "raycursive/niri-displays",
    "rylos/syncthing",
    "rylos/tailnet",
    "oldirtty/color_picker",
    "noctalia/screen_recorder",
    "samuelskovbakke/calculator-plus",
    "yuuto/calculator",
    "nightwatch75/file-search",
    "yugaaank/better-clock"
]

[shell]
avatar_path = "/home/mag/HOME-SERVER-STORAGE/shared-myart-files/export_img/towa_heh_v3.png"
font_family = "Noto Sans Thai Looped"
polkit_agent = true

    [shell.launcher]
    pinned = [ "kitty", "com.shellyorg.shelly" ]

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_control_center = true
    polkit_placement = "attached"

    [shell.screen_corners]
    enabled = true
    size = 20

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "/home/mag/Pictures/screenshots-pc"
    filename_pattern = "screenshot_%Y-%m-%d_%H%M%S"
    remember_last_region = true

    [shell.session]
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 5.0
        enabled = true
        glyph = "bed-filled"
        label = "Sleep"
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 5.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

